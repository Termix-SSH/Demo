    <meta name="theme-color" content="#1e1e21" />
    <style>
      .hide-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }

      .skinny-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4a #1e1e21;
      }

      .skinny-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }

      .skinny-scrollbar::-webkit-scrollbar-track {
        background: #1e1e21;
      }

      .skinny-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 3px;
        border: 1px solid #1e1e21;
      }

      .toolbar-scrollbar {
        scrollbar-width: thin;
        scrollbar-color: #4a4a4a transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar {
        height: 3px;
      }

      .toolbar-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }

      .toolbar-scrollbar::-webkit-scrollbar-thumb {
        background-color: #4a4a4a;
        border-radius: 2px;
      }
    </style>
  </head>
