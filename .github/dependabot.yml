version: 2
updates:
  # npm waits 3 days after a release. Minor and patch updates come as one
  # weekly PR, each major as its own PR. Security updates skip the wait.
  - package-ecosystem: npm
    directories:
      - "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint does not run on TypeScript 7 yet.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # These follow core and the SDK, since the Demo runs core's UI.
      - dependency-name: react
        update-types:
          - version-update:semver-major
      - dependency-name: react-dom
        update-types:
          - version-update:semver-major
      - dependency-name: i18next
        update-types:
          - version-update:semver-major
      - dependency-name: react-i18next
        update-types:
          - version-update:semver-major
      - dependency-name: sonner
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: chore

  # Keeps the SHA pinned actions current. The cooldown skips releases younger
  # than a week.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
