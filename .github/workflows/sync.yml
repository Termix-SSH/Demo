name: Sync

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The push goes through the App token, the job token only reads.
permissions: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
    steps:
      - name: App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: Termix-SSH
          repositories: Demo
          permission-contents: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ steps.app.outputs.token }}
          # The commit step pushes with it.
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Clone sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          git clone --depth 1 https://github.com/Termix-SSH/Termix.git
          git clone --depth 1 https://github.com/Termix-SSH/Termix-Registry.git Registry
          mkdir Plugins
          cd Plugins
          for repo in $(gh repo list Termix-SSH --limit 200 --no-archived --json name -q '.[].name | select(startswith("Plugin-"))'); do
            git clone --depth 1 "https://github.com/Termix-SSH/$repo.git"
          done

      - run: npm run sync

      - name: Lockfile lint
        uses: Termix-SSH/Termix-Registry/.github/actions/supply-chain@main
        with:
          osv: "false"

      - run: npm ci --ignore-scripts
        env:
          HUSKY: 0

      - run: npm run build

      - name: Commit changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync"
          git push
